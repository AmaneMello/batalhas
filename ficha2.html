<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Encurtar e Copiar Ficha de Ordem</title>
</head>
<body>

    <!-- Botão que aciona a função -->
    <button onclick="gerarLinkCurto()">Gerar e Copiar Link da Ficha</button>

    <script>
        async function gerarLinkCurto() {
            // 1. Cole aqui o link grande da sua ficha de ordem entre as aspas:
            const linkOriginal = "https://suaplataforma.com/sua-ficha-de-ordem-longa-aqui?id=12345&token=exemplo";

            try {
                // 2. Chama a API do TinyURL para encolher o link
                const resposta = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(linkOriginal)}`);
                
                if (!resposta.ok) {
                    throw new Error("Erro ao comunicar com o encurtador.");
                }

                const linkEncurtado = await resposta.text();

                // 3. Copia o link menor automaticamente para a memória do dispositivo
                await navigator.clipboard.writeText(linkEncurtado);

                // 4. Mostra o resultado na tela para você confirmar
                alert("Sucesso! Link encurtado e copiado:\n\n" + linkEncurtado);

            } catch (erro) {
                console.error(erro);
                alert("Ocorreu um erro ao tentar encurtar o link. Verifique a conexão.");
            }
        }
    </script>

</body>
</html>
