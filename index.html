<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Batalha e Criador de Fichas</title>
    <!-- Importa a biblioteca para gerar a imagem da ficha -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #ff5252;
            text-align: center;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #b71c1c;
            padding-bottom: 10px;
            width: 100%;
            max-width: 600px;
        }
        .selector-box {
            background-color: #1e1e1e;
            border: 2px solid #ff5252;
            border-radius: 8px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.95rem;
        }
        select {
            width: 100%;
            padding: 8px;
            background: #2c2c2c;
            color: white;
            border: 1px solid #ff5252;
            border-radius: 4px;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
        .container {
            display: flex;
            justify-content: center;
            width: 100%;
        }
        .monster-card, .custom-sheet {
            background-color: #1e1e1e;
            border: 2px solid #b71c1c;
            border-radius: 8px;
            width: 320px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: none;
        }
        /* Estilo específico para a Ficha Customizada estilo Ordem */
        .custom-sheet {
            border-color: #d32f2f;
            width: 350px;
        }
        .custom-sheet h2 {
            color: #ff5252;
            border-bottom: 1px solid #d32f2f;
            margin-top: 0;
            padding-bottom: 5px;
            font-size: 1.2rem;
            text-align: center;
        }
        .form-group {
            margin-bottom: 10px;
            font-size: 0.85rem;
        }
        .form-group label {
            font-size: 0.8rem;
            color: #ff8a80;
            margin-bottom: 2px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 6px;
            background: #2c2c2c;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .form-row {
            display: flex;
            gap: 8px;
        }

        /* Cores dos monstros */
        .card-lizard { border-color: #4caf50; }
        .card-lizard h2 { color: #81c784; border-bottom-color: #4caf50; }
        .card-lizard select, .card-lizard button { background-color: #388e3c; }
        
        .card-bovine { border-color: #795548; }
        .card-bovine h2 { color: #a1887f; border-bottom-color: #795548; }
        .card-bovine select, .card-bovine button { background-color: #5d4037; }

        .card-spider { border-color: #9c27b0; }
        .card-spider h2 { color: #ba68c8; border-bottom-color: #9c27b0; }
        .card-spider select, .card-spider button { background-color: #7b1fa2; }

        .card-wyvern { border-color: #ff9800; }
        .card-wyvern h2 { color: #ffb74d; border-bottom-color: #ff9800; }
        .card-wyvern select, .card-wyvern button { background-color: #f57c00; }

        .card-ant { border-color: #607d8b; }
        .card-ant h2 { color: #90a4ae; border-bottom-color: #607d8b; }
        .card-ant select, .card-ant button { background-color: #455a64; }

        .card-armored { border-color: #00bcd4; }
        .card-armored h2 { color: #4dd0e1; border-bottom-color: #00bcd4; }
        .card-armored select, .card-armored button { background-color: #0097a7; }

        .card-fungal { border-color: #8bc34a; }
        .card-fungal h2 { color: #aed581; border-bottom-color: #8bc34a; }
        .card-fungal select, .card-fungal button { background-color: #689f38; }

        .card-wolf { border-color: #e91e63; }
        .card-wolf h2 { color: #f06292; border-bottom-color: #e91e63; }
        .card-wolf select, .card-wolf button { background-color: #c2185b; }

        .card-mole { border-color: #8d6e63; }
        .card-mole h2 { color: #d7ccc8; border-bottom-color: #8d6e63; }
        .card-mole select, .card-mole button { background-color: #4e342e; }

        .card-plant { border-color: #2e7d32; }
        .card-plant h2 { color: #81c784; border-bottom-color: #2e7d32; }
        .card-plant select, .card-plant button { background-color: #1b5e20; }

        .card-paraves { border-color: #009688; }
        .card-paraves h2 { color: #4db6ac; border-bottom-color: #009688; }
        .card-paraves select, .card-paraves button { background-color: #00796b; }

        .card-caudata { border-color: #673ab7; }
        .card-caudata h2 { color: #9575cd; border-bottom-color: #673ab7; }
        .card-caudata select, .card-caudata button { background-color: #512da8; }

        h2 { 
            margin-top: 0; 
            border-bottom: 1px solid; 
            padding-bottom: 8px; 
            font-size: 1.1rem;
        }
        .card-select {
            width: 100%;
            padding: 6px;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 8px 0;
            font-size: 0.85rem;
        }
        .stat-box {
            background: #2c2c2c;
            padding: 6px;
            text-align: center;
            border-radius: 4px;
        }
        p { font-size: 0.8rem; margin: 5px 0; }
        button.action-btn, .save-btn {
            color: white;
            border: none;
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 6px;
            width: 100%;
            font-weight: bold;
            font-size: 0.85rem;
            background-color: #b71c1c;
        }
        .save-btn { background-color: #2e7d32; }
        .save-btn:hover { background-color: #388e3c; }
        .result {
            margin-top: 2px;
            margin-bottom: 6px;
            font-style: italic;
            text-align: center;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <h1>Painel de Batalha</h1>

    <!-- Menu de Seleção Inicial com a opção de criar ficha -->
    <div class="selector-box">
        <label for="seletor-global">Escolha uma opção:</label>
        <select id="seletor-global" onchange="mostrarSelecao()">
            <option value="">-- Selecione na lista --</option>
            <option value="criar_ficha" style="color: #ff5252; font-weight: bold;">+ Criar Nova Ficha (Estilo Ordem)</option>
        </select>
    </div>

    <!-- Container onde os cards e a ficha customizada vão aparecer -->
    <div class="container" id="painel-monstros">
        
        <!-- Ficha Customizada Estilo Ordem -->
        <div class="custom-sheet" id="card-criar_ficha">
            <h2>Ficha de Personagem</h2>
            <div class="form-group">
                <label>Nome do Personagem / Monstro:</label>
                <input type="text" id="sheet-nome" placeholder="Ex: Agente Silva">
            </div>
            <div class="form-row">
                <div class="form-group" style="flex: 1;">
                    <label>PV (Vida):</label>
                    <input type="text" id="sheet-pv" placeholder="20/20">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Sanidade:</label>
                    <input type="text" id="sheet-san" placeholder="15/15">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex: 1;">
                    <label>Defesa (CA):</label>
                    <input type="text" id="sheet-def" placeholder="10">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Esquiva:</label>
                    <input type="text" id="sheet-esq" placeholder="10">
                </div>
            </div>
            <div class="form-group">
                <label>Atributos (AGI, FOR, INT, PRE, VIG):</label>
                <input type="text" id="sheet-atrib" placeholder="Ex: 2, 3, 1, 2, 2">
            </div>
            <div class="form-group">
                <label>Habilidades / Ataques:</label>
                <textarea id="sheet-hab" rows="3" placeholder="Descreva os ataques..."></textarea>
            </div>
            <button class="save-btn" onclick="baixarFichaImagem()">Baixar Ficha como Imagem</button>
        </div>

    </div>

    <script>
        const monstrosLista = [
            { id: "lizard_a", nome: "Lizard (Tipo A)", base: "lizard", hp: 30, caVal: 6, visaoVal: 12, dif: "A para B: +5hp / 2d12 visão" },
            { id: "lizard_b", nome: "Lizard (Tipo B)", base: "lizard", hp: 35, caVal: 6, visaoVal: "2d12", dif: "A para B: +5hp / 2d12 visão" },
            { id: "bovine_a", nome: "Bovine (Tipo A)", base: "bovine", hp: 22, caVal: 12, visaoVal: 20, dif: "A para B: -3hp / -2 ca" },
            { id: "bovine_b", nome: "Bovine (Tipo B)", base: "bovine", hp: 19, caVal: 10, visaoVal: 20, dif: "A para B: -3hp / -2 ca" },
            { id: "spider_a", nome: "Spider (Tipo A)", base: "spider", hp: 35, caVal: 10, visaoVal: 6, dif: "A para B: -5hp / +3 ca" },
            { id: "spider_b", nome: "Spider (Tipo B)", base: "spider", hp: 30, caVal: 13, visaoVal: 6, dif: "A para B: -5hp / +3 ca" },
            { id: "wyvern_a", nome: "Wyvern (Tipo A)", base: "wyvern", hp: 15, caVal: 12, visaoVal: 20, dif: "A para B: -2hp / +2 ca" },
            { id: "wyvern_b", nome: "Wyvern (Tipo B)", base: "wyvern", hp: 13, caVal: 14, visaoVal: 20, dif: "A para B: -2hp / +2 ca" },
            { id: "ant_a", nome: "Ant (Tipo A)", base: "ant", hp: 22, caVal: 6, visaoVal: 6, dif: "A para B: -1hp / 2d6 visão" },
            { id: "ant_b", nome: "Ant (Tipo B)", base: "ant", hp: 21, caVal: 6, visaoVal: "2d6", dif: "A para B: -1hp / 2d6 visão" },
            { id: "armored_a", nome: "Armored (Tipo A)", base: "armored", hp: 40, caVal: 10, visaoVal: 20, dif: "n tem B" },
            { id: "fungal_a", nome: "Fungal (Tipo A)", base: "fungal", hp: 30, caVal: 6, visaoVal: 10, dif: "A para B: +2hp / 3d10 visão" },
            { id: "fungal_b", nome: "Fungal (Tipo B)", base: "fungal", hp: 32, caVal: 6, visaoVal: "3d10", dif: "A para B: +2hp / 3d10 visão" },
            { id: "wolf_a", nome: "Wolf (Tipo A)", base: "wolf", hp: 25, caVal: 6, visaoVal: 6, dif: "n tem B" },
            { id: "mole_a", nome: "Mole (Tipo A)", base: "mole", hp: 22, caVal: 12, visaoVal: 20, dif: "n tem B" },
            { id: "plant_a", nome: "Plant (Tipo A)", base: "plant", hp: 15, caVal: 10, visaoVal: 10, dif: "n tem B" },
            { id: "paraves_a", nome: "Paraves (Tipo A)", base: "paraves", hp: 18, caVal: 12, visaoVal: 12, dif: "n tem B" },
            { id: "caudata_a", nome: "Caudata (Tipo A)", base: "caudata", hp: 40, caVal: 10, visaoVal: 6, dif: "A para B: -3hp / +5 ca" },
            { id: "caudata_b", nome: "Caudata (Tipo B)", base: "caudata", hp: 37, caVal: 15, visaoVal: 6, dif: "A para B: -3hp / +5 ca" }
        ];

        function montarPagina() {
            let seletorGlobal = document.getElementById('seletor-global');
            let container = document.getElementById('painel-monstros');
            let optionsHtml = `
                <option value="">-- Selecione na lista --</option>
                <option value="criar_ficha" style="color: #ff5252; font-weight: bold;">+ Criar Nova Ficha (Estilo Ordem)</option>
            `;
            let cardsHtml = document.getElementById('card-criar_ficha').outerHTML; // Mantém a ficha customizada

            monstrosLista.forEach(m => {
                optionsHtml += `<option value="${m.id}">${m.nome}</option>`;
                cardsHtml += criarCardHtml(m);
            });

            seletorGlobal.innerHTML = optionsHtml;
            container.innerHTML = cardsHtml;
        }

        function criarCardHtml(m) {
            return `
                <div class="monster-card card-${m.base}" id="card-${m.id}" style="display:none;">
                    <h2>${m.nome}</h2>
                    <select class="card-select" id="var-${m.id}" onchange="atualizarCard('${m.id}')">
                        <option value="yoju">Yoju (Pequeno)</option>
                        <option value="honju">Honju (Grande)</option>
                    </select>
                    <div class="stats">
                        <div class="stat-box">HP: <span id="hp-${m.id}">--</span></div>
                        <div class="stat-box">CA: <span id="ca-${m.id}">--</span></div>
                    </div>
                    <p><strong>Ataque:</strong> <span id="info-ataque-${m.id}">1d20 + 3</span></p>
                    <p><strong>Visão:</strong> <span id="info-visao-${m.id}">--</span></p>
                    <p style="font-size:0.75rem; color:#888;">${m.dif}</p>
                    
                    <button class="action-btn" onclick="rolar('${m.id}', 'ataque')">Rolar Ataque</button>
                    <div id="res-${m.id}-ataque" class="result"></div>
                    
                    <button class="action-btn" onclick="rolar('${m.id}', 'dano')">Rolar Dano</button>
                    <div id="res-${m.id}-dano" class="result"></div>

                    <button class="action-btn" onclick="rolar('${m.id}', 'visao')">Rolar Percepção/Visão</button>
                    <div id="res-${m.id}-visao" class="result"></div>
                </div>
            `;
        }

        function mostrarSelecao() {
            let escolhido = document.getElementById('seletor-global').value;
            
            // Oculta todos os cards e a ficha de criação
            let elements = document.querySelectorAll('.monster-card, .custom-sheet');
            elements.forEach(el => el.style.display = 'none');

            // Mostra apenas o item selecionado
            if (escolhido) {
                let alvo = document.getElementById(`card-${escolhido}`);
                if (alvo) {
                    alvo.style.display = 'block';
                    if (escolhido !== 'criar_ficha') {
                        atualizarCard(escolhido);
                    }
                }
            }
        }

        function obterStats(chave) {
            let m = monstrosLista.find(item => item.id === chave);
            let elementoVar = document.getElementById('var-' + chave);
            let variante = elementoVar ? elementoVar.value : 'yoju';

            let hp = m.hp;
            let ca = m.caVal;
            let visaoFaces = m.visaoVal;

            let descVisaoStr = typeof visaoFaces === 'number' ? `1d${visaoFaces}` : visaoFaces;

            if (variante === 'honju') {
                hp = Math.floor(hp * 1.8);
                ca += 2;
            }

            return {
                hp: hp,
                ca: ca,
                visaoFacesRaw: visaoFaces,
                tipoVisaoDesc: descVisaoStr
            };
        }

        function atualizarCard(chave) {
            let s = obterStats(chave);
            document.getElementById('hp-' + chave).innerText = s.hp;
            document.getElementById('ca-' + chave).innerText = s.ca;
            document.getElementById('info-visao-' + chave).innerText = s.tipoVisaoDesc;
        }

        function rolar(chave, tipoAcao) {
            let s = obterStats(chave);

            if (tipoAcao === 'ataque') {
                let dado = Math.floor(Math.random() * 20) + 1;
                let total = dado + 4;
                document.getElementById(`res-${chave}-ataque`).innerText = `Total: ${total} (1d20: ${dado} + 4)`;
            } else if (tipoAcao === 'dano') {
                let dado = Math.floor(Math.random() * 6) + 1;
                let total = dado + 2;
                document.getElementById(`res-${chave}-dano`).innerText = `Total: ${total} de dano (1d6: ${dado} + 2)`;
            } else if (tipoAcao === 'visao') {
                let resultadoVisao = 0;
                let descRolagem = "";
                
                if (typeof s.visaoFacesRaw === 'number') {
                    let dado = Math.floor(Math.random() * s.visaoFacesRaw) + 1;
                    resultadoVisao = dado;
                    descRolagem = `1d${s.visaoFacesRaw}: ${dado}`;
                } else {
                    let partes = s.visaoFacesRaw.split('d');
                    let qtd = parseInt(partes[0]);
                    let faces = parseInt(partes[1]);
                    let soma = 0;
                    let lancamentos = [];
                    for(let i=0; i<qtd; i++) {
                        let d = Math.floor(Math.random() * faces) + 1;
                        soma += d;
                        lancamentos.push(d);
                    }
                    resultadoVisao = soma;
                    descRolagem = `${s.visaoFacesRaw}: [${lancamentos.join(', ')}]`;
                }

                document.getElementById(`res-${chave}-visao`).innerText = `Visão: ${resultadoVisao} (${descRolagem})`;
            }
        }

        // Função para transformar a ficha preenchida em imagem e baixar
        function baixarFichaImagem() {
            let cardFicha = document.getElementById('card-criar_ficha');
            
            // Oculta temporariamente o botão de download para não sair na imagem
            let botao = cardFicha.querySelector('.save-btn');
            botao.style.display = 'none';

            html2canvas(cardFicha, { backgroundColor: '#1e1e1e' }).then(canvas => {
                let link = document.createElement('a');
                link.download = 'ficha-personagem.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                // Restaura o botão na tela
                botao.style.display = 'block';
            });
        }

        window.onload = function() {
            montarPagina();
        };
    </script>
</body>
</html>
