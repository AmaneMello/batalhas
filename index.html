<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Batalha - Monstros Ajustados</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #ff5252;
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #b71c1c;
            padding-bottom: 10px;
            width: 100%;
            max-width: 1200px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
        }
        .monster-card {
            background-color: #1e1e1e;
            border: 2px solid #b71c1c;
            border-radius: 8px;
            width: 280px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Cores exclusivas para cada monstro */
        .card-lizard { border-color: #4caf50; }
        .card-lizard h2 { color: #81c784; border-bottom-color: #4caf50; }
        .card-lizard select, .card-lizard button { background-color: #388e3c; }
        .card-lizard button:hover { background-color: #4caf50; }
        .card-lizard .result { color: #c8e6c9; }

        .card-bovine { border-color: #795548; }
        .card-bovine h2 { color: #a1887f; border-bottom-color: #795548; }
        .card-bovine select, .card-bovine button { background-color: #5d4037; }
        .card-bovine button:hover { background-color: #795548; }
        .card-bovine .result { color: #d7ccc8; }

        .card-spider { border-color: #9c27b0; }
        .card-spider h2 { color: #ba68c8; border-bottom-color: #9c27b0; }
        .card-spider select, .card-spider button { background-color: #7b1fa2; }
        .card-spider button:hover { background-color: #9c27b0; }
        .card-spider .result { color: #e1bee7; }

        .card-wyvern { border-color: #ff9800; }
        .card-wyvern h2 { color: #ffb74d; border-bottom-color: #ff9800; }
        .card-wyvern select, .card-wyvern button { background-color: #f57c00; }
        .card-wyvern button:hover { background-color: #ff9800; }
        .card-wyvern .result { color: #ffe0b2; }

        .card-ant { border-color: #607d8b; }
        .card-ant h2 { color: #90a4ae; border-bottom-color: #607d8b; }
        .card-ant select, .card-ant button { background-color: #455a64; }
        .card-ant button:hover { background-color: #607d8b; }
        .card-ant .result { color: #cfd8dc; }

        .card-armored { border-color: #00bcd4; }
        .card-armored h2 { color: #4dd0e1; border-bottom-color: #00bcd4; }
        .card-armored select, .card-armored button { background-color: #0097a7; }
        .card-armored button:hover { background-color: #00bcd4; }
        .card-armored .result { color: #b2ebf2; }

        .card-fungal { border-color: #8bc34a; }
        .card-fungal h2 { color: #aed581; border-bottom-color: #8bc34a; }
        .card-fungal select, .card-fungal button { background-color: #689f38; }
        .card-fungal button:hover { background-color: #8bc34a; }
        .card-fungal .result { color: #dcedc8; }

        .card-wolf { border-color: #e91e63; }
        .card-wolf h2 { color: #f06292; border-bottom-color: #e91e63; }
        .card-wolf select, .card-wolf button { background-color: #c2185b; }
        .card-wolf button:hover { background-color: #e91e63; }
        .card-wolf .result { color: #f8bbd0; }

        .card-mole { border-color: #8d6e63; }
        .card-mole h2 { color: #d7ccc8; border-bottom-color: #8d6e63; }
        .card-mole select, .card-mole button { background-color: #4e342e; }
        .card-mole button:hover { background-color: #6d4c41; }
        .card-mole .result { color: #efebe9; }

        .card-plant { border-color: #2e7d32; }
        .card-plant h2 { color: #81c784; border-bottom-color: #2e7d32; }
        .card-plant select, .card-plant button { background-color: #1b5e20; }
        .card-plant button:hover { background-color: #2e7d32; }
        .card-plant .result { color: #c8e6c9; }

        .card-paraves { border-color: #009688; }
        .card-paraves h2 { color: #4db6ac; border-bottom-color: #009688; }
        .card-paraves select, .card-paraves button { background-color: #00796b; }
        .card-paraves button:hover { background-color: #009688; }
        .card-paraves .result { color: #b2dfdb; }

        .card-caudata { border-color: #673ab7; }
        .card-caudata h2 { color: #9575cd; border-bottom-color: #673ab7; }
        .card-caudata select, .card-caudata button { background-color: #512da8; }
        .card-caudata button:hover { background-color: #673ab7; }
        .card-caudata .result { color: #d1c4e9; }

        h2 { 
            margin-top: 0; 
            border-bottom: 1px solid; 
            padding-bottom: 8px; 
            font-size: 1.1rem;
        }
        select {
            width: 100%;
            padding: 6px;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 8px 0;
            font-size: 0.85rem;
        }
        .stat-box {
            background: #2c2c2c;
            padding: 6px;
            text-align: center;
            border-radius: 4px;
        }
        p { font-size: 0.8rem; margin: 5px 0; }
        button {
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 4px;
            width: 100%;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .result {
            margin-top: 2px;
            margin-bottom: 6px;
            font-style: italic;
            text-align: center;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <h1>Painel de Batalha - Monstros</h1>

    <div class="container" id="painel-monstros"></div>

    <script>
        const monstrosLista = [
            { id: "lizard", nome: "Lizard", hp: 30, caVal: 6, visaoVal: 12, dif: "A para B: +5hp / 2d12 visão", temB: true },
            { id: "bovine", nome: "Bovine", hp: 22, caVal: 12, visaoVal: 20, dif: "A para B: -3hp / -2 ca", temB: true },
            { id: "spider", nome: "Spider", hp: 35, caVal: 10, visaoVal: 6, dif: "A para B: -5hp / +3 ca", temB: true },
            { id: "wyvern", nome: "Wyvern", hp: 15, caVal: 12, visaoVal: 20, dif: "A para B: -2hp / +2 ca", temB: true },
            { id: "ant", nome: "Ant", hp: 22, caVal: 6, visaoVal: 6, dif: "A para B: -1hp / 2d6 visão", temB: true },
            { id: "armored", nome: "Armored", hp: 40, caVal: 10, visaoVal: 20, dif: "n tem B", temB: false },
            { id: "fungal", nome: "Fungal", hp: 30, caVal: 6, visaoVal: 10, dif: "A para B: +2hp / 3d10 visão", temB: true },
            { id: "wolf", nome: "Wolf", hp: 25, caVal: 6, visaoVal: 6, dif: "n tem B", temB: false },
            { id: "mole", nome: "Mole", hp: 22, caVal: 12, visaoVal: 20, dif: "n tem B", temB: false },
            { id: "plant", nome: "Plant", hp: 15, caVal: 10, visaoVal: 10, dif: "n tem B", temB: false },
            { id: "paraves", nome: "Paraves", hp: 18, caVal: 12, visaoVal: 12, dif: "n tem B", temB: false },
            { id: "caudata", nome: "Caudata", hp: 40, caVal: 10, visaoVal: 6, dif: "A para B: -3hp / +5 ca", temB: true }
        ];

        function gerarCards() {
            let container = document.getElementById('painel-monstros');
            let html = '';

            monstrosLista.forEach(m => {
                // Sempre cria o Tipo A
                html += criarCardHtml(m.id + "_a", `${m.nome} (Tipo A)`, m.id, m);
                // Cria o Tipo B apenas se a criatura possuir
                if (m.temB) {
                    html += criarCardHtml(m.id + "_b", `${m.nome} (Tipo B)`, m.id, m);
                }
            });

            container.innerHTML = html;
        }

        function criarCardHtml(chave, titulo, baseId, dadosBase) {
            return `
                <div class="monster-card card-${baseId}" id="card-${chave}">
                    <h2>${titulo}</h2>
                    <select id="var-${chave}" onchange="atualizarCard('${chave}')">
                        <option value="yoju">Yoju (Pequeno)</option>
                        <option value="honju">Honju (Grande)</option>
                    </select>
                    <div class="stats">
                        <div class="stat-box">HP: <span id="hp-${chave}">--</span></div>
                        <div class="stat-box">CA: <span id="ca-${chave}">--</span></div>
                    </div>
                    <p><strong>Ataque:</strong> <span id="info-ataque-${chave}">1d20 + 3</span></p>
                    <p><strong>Visão:</strong> <span id="info-visao-${chave}">--</span></p>
                    <p style="font-size:0.75rem; color:#888;">${dadosBase.dif}</p>
                    
                    <button onclick="rolar('${chave}', 'ataque')">Rolar Ataque</button>
                    <div id="res-${chave}-ataque" class="result"></div>
                    
                    <button onclick="rolar('${chave}', 'dano')">Rolar Dano</button>
                    <div id="res-${chave}-dano" class="result"></div>

                    <button onclick="rolar('${chave}', 'visao')">Rolar Percepção/Visão</button>
                    <div id="res-${chave}-visao" class="result"></div>
                </div>
            `;
        }

        function obterStats(chave) {
            let [baseName, tipo] = chave.split('_');
            let m = monstrosLista.find(item => item.id === baseName);
            let elementoVar = document.getElementById('var-' + chave);
            let variante = elementoVar ? elementoVar.value : 'yoju';

            let hp = m.hp;
            let ca = m.caVal;
            let visaoFaces = m.visaoVal;

            if (tipo === 'b') {
                if (baseName === 'lizard') { hp += 5; visaoFaces = "2d12"; }
                else if (baseName === 'bovine') { hp -= 3; ca -= 2; }
                else if (baseName === 'spider') { hp -= 5; ca += 3; }
                else if (baseName === 'wyvern') { hp -= 2; ca += 2; }
                else if (baseName === 'ant') { hp -= 1; visaoFaces = "2d6"; }
                else if (baseName === 'fungal') { hp += 2; visaoFaces = "3d10"; }
                else if (baseName === 'caudata') { hp -= 3; ca += 5; }
            }

            let descVisaoStr = typeof visaoFaces === 'number' ? `1d${visaoFaces}` : visaoFaces;

            if (variante === 'honju') {
                hp = Math.floor(hp * 1.8);
                ca += 2;
            }

            return {
                hp: hp,
                ca: ca,
                visaoFacesRaw: visaoFaces,
                tipoVisaoDesc: descVisaoStr
            };
        }

        function atualizarCard(chave) {
            let s = obterStats(chave);
            document.getElementById('hp-' + chave).innerText = s.hp;
            document.getElementById('ca-' + chave).innerText = s.ca;
            document.getElementById('info-visao-' + chave).innerText = s.tipoVisaoDesc;
        }

        function rolar(chave, tipoAcao) {
            let s = obterStats(chave);

            if (tipoAcao === 'ataque') {
                let dado = Math.floor(Math.random() * 20) + 1;
                let total = dado + 4;
                document.getElementById(`res-${chave}-ataque`).innerText = `Total: ${total} (1d20: ${dado} + 4)`;
            } else if (tipoAcao === 'dano') {
                let dado = Math.floor(Math.random() * 6) + 1;
                let total = dado + 2;
                document.getElementById(`res-${chave}-dano`).innerText = `Total: ${total} de dano (1d6: ${dado} + 2)`;
            } else if (tipoAcao === 'visao') {
                let resultadoVisao = 0;
                let descRolagem = "";
                
                if (typeof s.visaoFacesRaw === 'number') {
                    let dado = Math.floor(Math.random() * s.visaoFacesRaw) + 1;
                    resultadoVisao = dado;
                    descRolagem = `1d${s.visaoFacesRaw}: ${dado}`;
                } else {
                    let partes = s.visaoFacesRaw.split('d');
                    let qtd = parseInt(partes[0]);
                    let faces = parseInt(partes[1]);
                    let soma = 0;
                    let lancamentos = [];
                    for(let i=0; i<qtd; i++) {
                        let d = Math.floor(Math.random() * faces) + 1;
                        soma += d;
                        lancamentos.push(d);
                    }
                    resultadoVisao = soma;
                    descRolagem = `${s.visaoFacesRaw}: [${lancamentos.join(', ')}]`;
                }

                document.getElementById(`res-${chave}-visao`).innerText = `Visão: ${resultadoVisao} (${descRolagem})`;
            }
        }

        window.onload = function() {
            gerarCards();
            monstrosLista.forEach(m => {
                atualizarCard(m.id + "_a");
                if (m.temB) {
                    atualizarCard(m.id + "_b");
                }
            });
        };
    </script>
</body>
</html>
