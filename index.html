<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Batalha - Lista Completa de Monstros</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #ff5252;
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #b71c1c;
            padding-bottom: 10px;
            width: 100%;
            max-width: 1200px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
        }
        .monster-card {
            background-color: #1e1e1e;
            border: 2px solid #b71c1c;
            border-radius: 8px;
            width: 280px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 { 
            color: #ff5252; 
            margin-top: 0; 
            border-bottom: 1px solid #b71c1c; 
            padding-bottom: 8px; 
            font-size: 1.1rem;
        }
        select {
            width: 100%;
            padding: 6px;
            background: #2c2c2c;
            color: white;
            border: 1px solid #b71c1c;
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 8px 0;
            font-size: 0.85rem;
        }
        .stat-box {
            background: #2c2c2c;
            padding: 6px;
            text-align: center;
            border-radius: 4px;
        }
        p { font-size: 0.8rem; margin: 5px 0; }
        button {
            background-color: #b71c1c;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 4px;
            width: 100%;
            font-weight: bold;
            font-size: 0.8rem;
        }
        button:hover { background-color: #d32f2f; }
        .result {
            margin-top: 2px;
            margin-bottom: 6px;
            font-style: italic;
            color: #ff8a80;
            text-align: center;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <h1>Painel de Batalha - Monstros</h1>

    <div class="container" id="painel-monstros">
        <!-- Os cards serão gerados dinamicamente via script para garantir todas as especificações -->
    </div>

    <script>
        // Definição dos dados base para cada monstro (Tipo A e B, com variantes Yoju e Honju)
        const monstrosLista = [
            { id: "lizard", nome: "Lizard", hp: 30, caVal: 6, visaoVal: 12, dif: "A para B: +5hp / 2d12 visão" },
            { id: "bovine", nome: "Bovine", hp: 22, caVal: 12, visaoVal: 20, dif: "A para B: -3hp / -2 ca" },
            { id: "spider", nome: "Spider", hp: 35, caVal: 10, visaoVal: 6, dif: "A para B: -5hp / +3 ca" },
            { id: "wyvern", nome: "Wyvern", hp: 15, caVal: 12, visaoVal: 20, dif: "A para B: -2hp / +2 ca" },
            { id: "ant", nome: "Ant", hp: 22, caVal: 6, visaoVal: 6, dif: "A para B: -1hp / 2d6 visão" },
            { id: "armored", nome: "Armored", hp: 40, caVal: 10, visaoVal: 20, dif: "n tem B" },
            { id: "fungal", nome: "Fungal", hp: 30, caVal: 6, visaoVal: 10, dif: "A para B: +2hp / 3d10 visão" },
            { id: "wolf", nome: "Wolf", hp: 25, caVal: 6, visaoVal: 6, dif: "n tem B" },
            { id: "mole", nome: "Mole", hp: 22, caVal: 12, visaoVal: 20, dif: "n tem B" },
            { id: "plant", nome: "Plant", hp: 15, caVal: 10, visaoVal: 10, dif: "n tem B" },
            { id: "paraves", nome: "Paraves", hp: 18, caVal: 12, visaoVal: 12, dif: "n tem B" },
            { id: "caudata", nome: "Caudata", hp: 40, caVal: 10, visaoVal: 6, dif: "A para B: -3hp / +5 ca" }
        ];

        function gerarCards() {
            let container = document.getElementById('painel-monstros');
            let html = '';

            monstrosLista.forEach(m => {
                // Tipo A
                html += criarCardHtml(m.id + "_a", `${m.nome} (Tipo A)`, m);
                // Tipo B (se houver alteração ou se for gerado)
                html += criarCardHtml(m.id + "_b", `${m.nome} (Tipo B)`, m);
            });

            container.innerHTML = html;
        }

        function criarCardHtml(chave, titulo, dadosBase) {
            return `
                <div class="monster-card" id="card-${chave}">
                    <h2>${titulo}</h2>
                    <select id="var-${chave}" onchange="atualizarCard('${chave}')">
                        <option value="yoju">Yoju (Pequeno)</option>
                        <option value="honju">Honju (Grande)</option>
                    </select>
                    <div class="stats">
                        <div class="stat-box">HP: <span id="hp-${chave}">--</span></div>
                        <div class="stat-box">CA: <span id="ca-${chave}">--</span></div>
                    </div>
                    <p><strong>Ataque:</strong> <span id="info-ataque-${chave}">1d20 + 3</span></p>
                    <p><strong>Visão:</strong> <span id="info-visao-${chave}">--</span></p>
                    <p style="font-size:0.75rem; color:#888;">${dadosBase.dif}</p>
                    
                    <button onclick="rolar('${chave}', 'ataque')">Rolar Ataque</button>
                    <div id="res-${chave}-ataque" class="result"></div>
                    
                    <button onclick="rolar('${chave}', 'dano')">Rolar Dano</button>
                    <div id="res-${chave}-dano" class="result"></div>

                    <button onclick="rolar('${chave}', 'visao')">Rolar Percepção/Visão</button>
                    <div id="res-${chave}-visao" class="result"></div>
                </div>
            `;
        }

        // Calcula stats base para cada instância
        function obterStats(chave) {
            let [baseName, tipo] = chave.split('_');
            let m = monstrosLista.find(item => item.id === baseName);
            let elementoVar = document.getElementById('var-' + chave);
            let variante = elementoVar ? elementoVar.value : 'yoju';

            let hp = m.hp;
            let ca = m.caVal;
            let visaoFaces = m.visaoVal;

            // Ajuste Tipo B
            if (tipo === 'b') {
                if (baseName === 'lizard') { hp += 5; }
                else if (baseName === 'bovine') { hp -= 3; ca -= 2; }
                else if (baseName === 'spider') { hp -= 5; ca += 3; }
                else if (baseName === 'wyvern') { hp -= 2; ca += 2; }
                else if (baseName === 'ant') { hp -= 1; }
                else if (baseName === 'fungal') { hp += 2; }
                else if (baseName === 'caudata') { hp -= 3; ca += 5; }
            }

            // Ajuste de Variante (Yoju pequeno vs Honju grande)
            if (variante === 'honju') {
                hp = Math.floor(hp * 1.8);
                ca += 2;
            }

            return {
                hp: hp,
                ca: ca,
                visaoFaces: visaoFaces,
                tipoVisaoDesc: `1d${visaoFaces}`
            };
        }

        function atualizarCard(chave) {
            let s = obterStats(chave);
            document.getElementById('hp-' + chave).innerText = s.hp;
            document.getElementById('ca-' + chave).innerText = s.ca;
            document.getElementById('info-visao-' + chave).innerText = s.tipoVisaoDesc;
        }

        function rolar(chave, tipoAcao) {
            let s = obterStats(chave);

            if (tipoAcao === 'ataque') {
                let dado = Math.floor(Math.random() * 20) + 1;
                let total = dado + 4;
                document.getElementById(`res-${chave}-ataque`).innerText = `Total: ${total} (1d20: ${dado} + 4)`;
            } else if (tipoAcao === 'dano') {
                let dado = Math.floor(Math.random() * 6) + 1;
                let total = dado + 2;
                document.getElementById(`res-${chave}-dano`).innerText = `Total: ${total} de dano (1d6: ${dado} + 2)`;
            } else if (tipoAcao === 'visao') {
                let dado = Math.floor(Math.random() * s.visaoFaces) + 1;
                document.getElementById(`res-${chave}-visao`).innerText = `Teste Visão: ${dado} (1d${s.visaoFaces})`;
            }
        }

        // Inicializa todos os cards após carregar a página
        window.onload = function() {
            gerarCards();
            monstrosLista.forEach(m => {
                atualizarCard(m.id + "_a");
                atualizarCard(m.id + "_b");
            });
        };
    </script>
</body>
</html>
