<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Batalha e Criador de Fichas Avançado</title>
    <!-- Importa a biblioteca para gerar a imagem da ficha -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #ff5252;
            text-align: center;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #b71c1c;
            padding-bottom: 10px;
            width: 100%;
            max-width: 600px;
        }
        .selector-box {
            background-color: #1e1e1e;
            border: 2px solid #ff5252;
            border-radius: 8px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.95rem;
        }
        select {
            width: 100%;
            padding: 8px;
            background: #2c2c2c;
            color: white;
            border: 1px solid #ff5252;
            border-radius: 4px;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
        .container {
            display: flex;
            justify-content: center;
            width: 100%;
        }
        .monster-card, .custom-sheet {
            background-color: #1e1e1e;
            border: 2px solid #b71c1c;
            border-radius: 8px;
            width: 380px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: none;
        }
        .custom-sheet {
            border-color: #d32f2f;
            width: 440px;
        }
        .custom-sheet h2 {
            color: #ff5252;
            border-bottom: 1px solid #d32f2f;
            margin-top: 0;
            padding-bottom: 5px;
            font-size: 1.2rem;
            text-align: center;
        }
        .form-group {
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .form-group label {
            font-size: 0.8rem;
            color: #ff8a80;
            margin-bottom: 2px;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 5px;
            background: #2c2c2c;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.85rem;
        }
        textarea {
            resize: vertical;
            height: 60px;
        }
        .form-row {
            display: flex;
            gap: 8px;
        }
        .header-profile {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
        }
        .avatar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .avatar-box {
            width: 70px;
            height: 70px;
            border: 2px dashed #555;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #2c2c2c;
            cursor: pointer;
            position: relative;
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-box span {
            font-size: 0.65rem;
            color: #888;
            text-align: center;
            padding: 2px;
        }
        .avatar-input {
            display: none;
        }
        .section-title {
            font-size: 0.9rem;
            color: #ff5252;
            border-bottom: 1px dashed #555;
            margin: 10px 0 6px 0;
            padding-bottom: 2px;
            font-weight: bold;
        }
        .counter-badge {
            font-size: 0.75rem;
            color: #ffeb3b;
            float: right;
        }
        .attributes-grid {
            display: flex;
            gap: 6px;
            justify-content: space-between;
        }
        .attr-card {
            background: #252525;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 5px;
            text-align: center;
            flex: 1;
        }
        .attr-card label {
            font-size: 0.75rem;
            color: #ff8a80;
            margin-bottom: 2px;
        }
        .attr-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        .attr-input {
            width: 32px !important;
            text-align: center;
            padding: 2px !important;
            height: 22px;
            font-size: 0.75rem !important;
        }
        .roll-btn {
            background: #b71c1c;
            color: white;
            border: none;
            border-radius: 3px;
            width: 20px;
            height: 22px;
            cursor: pointer;
            font-size: 0.65rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .roll-btn:hover {
            background: #d32f2f;
        }
        .skills-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            max-height: 160px;
            overflow-y: auto;
            background: #151515;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #333;
        }
        .skill-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            background: #222;
            padding: 3px 6px;
            border-radius: 3px;
        }
        .skill-controls {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .skill-item input {
            width: 35px;
            text-align: center;
            padding: 2px;
            height: 22px;
            font-size: 0.75rem;
        }
        .calculated-box {
            background: #252525;
            padding: 6px;
            text-align: center;
            border-radius: 4px;
            border: 1px solid #444;
            font-weight: bold;
            color: #81c784;
            font-size: 0.85rem;
        }
        .inventory-container {
            background: #151515;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #333;
            max-height: 120px;
            overflow-y: auto;
        }
        .inventory-slot {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
            align-items: center;
        }
        .inventory-slot input[type="text"] {
            flex: 3;
        }
        .inventory-slot input[type="number"] {
            flex: 1;
            text-align: center;
        }
        .card-lizard { border-color: #4caf50; }
        .card-lizard h2 { color: #81c784; border-bottom-color: #4caf50; }
        .card-lizard select, .card-lizard button { background-color: #388e3c; }
        .card-bovine { border-color: #795548; }
        .card-bovine h2 { color: #a1887f; border-bottom-color: #795548; }
        .card-bovine select, .card-bovine button { background-color: #5d4037; }
        .card-spider { border-color: #9c27b0; }
        .card-spider h2 { color: #ba68c8; border-bottom-color: #9c27b0; }
        .card-spider select, .card-spider button { background-color: #7b1fa2; }
        .card-wyvern { border-color: #ff9800; }
        .card-wyvern h2 { color: #ffb74d; border-bottom-color: #ff9800; }
        .card-wyvern select, .card-wyvern button { background-color: #f57c00; }
        .card-ant { border-color: #607d8b; }
        .card-ant h2 { color: #90a4ae; border-bottom-color: #607d8b; }
        .card-ant select, .card-ant button { background-color: #455a64; }
        .card-armored { border-color: #00bcd4; }
        .card-armored h2 { color: #4dd0e1; border-bottom-color: #00bcd4; }
        .card-armored select, .card-armored button { background-color: #0097a7; }
        .card-fungal { border-color: #8bc34a; }
        .card-fungal h2 { color: #aed581; border-bottom-color: #8bc34a; }
        .card-fungal select, .card-fungal button { background-color: #689f38; }
        .card-wolf { border-color: #e91e63; }
        .card-wolf h2 { color: #f06292; border-bottom-color: #e91e63; }
        .card-wolf select, .card-wolf button { background-color: #c2185b; }
        .card-mole { border-color: #8d6e63; }
        .card-mole h2 { color: #d7ccc8; border-bottom-color: #8d6e63; }
        .card-mole select, .card-mole button { background-color: #4e342e; }
        .card-plant { border-color: #2e7d32; }
        .card-plant h2 { color: #81c784; border-bottom-color: #2e7d32; }
        .card-plant select, .card-plant button { background-color: #1b5e20; }
        .card-paraves { border-color: #009688; }
        .card-paraves h2 { color: #4db6ac; border-bottom-color: #009688; }
        .card-paraves select, .card-paraves button { background-color: #00796b; }
        .card-caudata { border-color: #673ab7; }
        .card-caudata h2 { color: #9575cd; border-bottom-color: #673ab7; }
        .card-caudata select, .card-caudata button { background-color: #512da8; }
        h2 { 
            margin-top: 0; 
            border-bottom: 1px solid; 
            padding-bottom: 8px; 
            font-size: 1.1rem;
        }
        .card-select {
            width: 100%;
            padding: 6px;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 8px 0;
            font-size: 0.85rem;
        }
        .stat-box {
            background: #2c2c2c;
            padding: 6px;
            text-align: center;
            border-radius: 4px;
        }
        p { font-size: 0.8rem; margin: 5px 0; }
        button.action-btn, .save-btn {
            color: white;
            border: none;
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 8px;
            width: 100%;
            font-weight: bold;
            font-size: 0.85rem;
            background-color: #b71c1c;
        }
        .save-btn { background-color: #2e7d32; }
        .save-btn:hover { background-color: #388e3c; }
        .result {
            margin-top: 2px;
            margin-bottom: 6px;
            font-style: italic;
            text-align: center;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <h1>Painel de Batalha</h1>

    <div class="selector-box">
        <label for="seletor-global">Escolha uma opção:</label>
        <select id="seletor-global" onchange="mostrarSelecao()">
            <option value="">-- Selecione na lista --</option>
            <option value="criar_ficha" style="color: #ff5252; font-weight: bold;">+ Criar Nova Ficha (Estilo Ordem)</option>
        </select>
    </div>

    <div class="container" id="painel-monstros">
        
        <div class="custom-sheet" id="card-criar_ficha">
            <h2>Ficha de Personagem (Ordem)</h2>
            
            <div class="form-group">
                <label>Nome do Player:</label>
                <input type="text" id="sheet-player" placeholder="Nome do Jogador" value="Hoshina gostoso">
            </div>

            <div class="header-profile">
                <div class="avatar-container">
                    <div class="avatar-box" onclick="document.getElementById('sheet-foto-input').click()" title="Clique para enviar foto">
                        <img id="avatar-preview" src="" style="display:none;" alt="Foto">
                        <span id="avatar-text">Enviar Foto</span>
                    </div>
                    <input type="file" id="sheet-foto-input" class="avatar-input" accept="image/*" onchange="carregarFoto(event)">
                </div>
                <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Nome do Personagem:</label>
                        <input type="text" id="sheet-nome" placeholder="Nome do Agente">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Classe:</label>
                        <select id="sheet-classe" onchange="atualizarDerivados()">
                            <option value="combatente">Combatente</option>
                            <option value="especialista">Especialista</option>
                            <option value="ocultista">Ocultista</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Descrição do Personagem / Aparência / Histórico:</label>
                <textarea id="sheet-descricao" placeholder="Escreva a história ou descrição do seu agente..."></textarea>
            </div>

            <div class="section-title">
                Atributos 
                <span class="counter-badge">Restantes: <span id="atrib-restantes">10</span>/10</span>
            </div>
            <div class="attributes-grid">
                <div class="attr-card">
                    <label>AGI</label>
                    <div class="attr-controls">
                        <input type="number" class="attr-input" id="attr-agi" value="1" min="0" max="5" onchange="verificarAtributos()">
                        <button type="button" class="roll-btn" title="Rolar AGI" onclick="rolarAtributo('AGI', 'attr-agi')">🎲</button>
                    </div>
                </div>
                <div class="attr-card">
                    <label>FOR</label>
                    <div class="attr-controls">
                        <input type="number" class="attr-input" id="attr-for" value="1" min="0" max="5" onchange="verificarAtributos()">
                        <button type="button" class="roll-btn" title="Rolar FOR" onclick="rolarAtributo('FOR', 'attr-for')">🎲</button>
                    </div>
                </div>
                <div class="attr-card">
                    <label>INT</label>
                    <div class="attr-controls">
                        <input type="number" class="attr-input" id="attr-int" value="1" min="0" max="5" onchange="verificarAtributos()">
                        <button type="button" class="roll-btn" title="Rolar INT" onclick="rolarAtributo('INT', 'attr-int')">🎲</button>
                    </div>
                </div>
                <div class="attr-card">
                    <label>PRE</label>
                    <div class="attr-controls">
                        <input type="number" class="attr-input" id="attr-pre" value="1" min="0" max="5" onchange="verificarAtributos()">
                        <button type="button" class="roll-btn" title="Rolar PRE" onclick="rolarAtributo('PRE', 'attr-pre')">🎲</button>
                    </div>
                </div>
                <div class="attr-card">
                    <label>VIG</label>
                    <div class="attr-controls">
                        <input type="number" class="attr-input" id="attr-vig" value="1" min="0" max="5" onchange="verificarAtributos()">
                        <button type="button" class="roll-btn" title="Rolar VIG" onclick="rolarAtributo('VIG', 'attr-vig')">🎲</button>
                    </div>
                </div>
            </div>

            <div class="section-title">Estatísticas Calculadas</div>
            <div class="form-row">
                <div class="form-group" style="flex: 1;">
                    <label>PV (Vida):</label>
                    <div class="calculated-box" id="calc-pv">20</div>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>SAN (Sanidade):</label>
                    <div class="calculated-box" id="calc-san">12</div>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>PE (Esforço):</label>
                    <div class="calculated-box" id="calc-pe">2</div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex: 1;">
                    <label>Defesa (CA):</label>
                    <div class="calculated-box" id="calc-def">10</div>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Esquiva:</label>
                    <div class="calculated-box" id="calc-esq">10</div>
                </div>
            </div>

            <div class="section-title">
                Inventário / Espaços 
                <span class="counter-badge">Capacidade: <span id="inv-capacidade">5</span> Slots</span>
            </div>
            <div class="inventory-container" id="inventory-slots-box">
            </div>

            <div class="section-title" style="margin-top: 10px;">
                Perícias 
                <span class="counter-badge">Restantes: <span id="pericia-restantes">20</span>/20</span>
            </div>
            <div class="skills-grid" id="skills-container">
            </div>
            <div id="res-pericia-global" class="result" style="color: #ff8a80; margin-top: 5px;"></div>

            <button class="save-btn" onclick="baixarFichaImagem()">Baixar Ficha como Imagem</button>
        </div>

    </div>

    <script>
        const listaNomesPericias = [
            "Acrobacia", "Adestramento", "Artes", "Atletismo", "Atualidades", 
            "Ciências", "Crime", "Diplomacia", "Enganação", "Fortitude", 
            "Furtividade", "Iniciativa", "Intimidação", "Intuição", "Investigação", 
            "Luta", "Medicina", "Ocultismo", "Percepção", "Pilotagem", 
            "Pontaria", "Profissão", "Reflexos", "Religião", "Sobrevivência", 
            "Tática", "Vontade"
        ];

        const monstrosLista = [
            { id: "lizard_a", nome: "Lizard (Tipo A)", base: "lizard", hp: 30, caVal: 6, visaoVal: 12, dif: "A para B: +5hp / 2d12 visão" },
            { id: "lizard_b", nome: "Lizard (Tipo B)", base: "lizard", hp: 35, caVal: 6, visaoVal: "2d12", dif: "A para B: +5hp / 2d12 visão" },
            { id: "bovine_a", nome: "Bovine (Tipo A)", base: "bovine", hp: 22, caVal: 12, visaoVal: 20, dif: "A para B: -3hp / -2 ca" },
            { id: "bovine_b", nome: "Bovine (Tipo B)", base: "bovine", hp: 19, caVal: 10, visaoVal: 20, dif: "A para B: -3hp / -2 ca" },
            { id: "spider_a", nome: "Spider (Tipo A)", base: "spider", hp: 35, caVal: 10, visaoVal: 6, dif: "A para B: -5hp / +3 ca" },
            { id: "spider_b", nome: "Spider (Tipo B)", base: "spider", hp: 30, caVal: 13, visaoVal: 6, dif: "A para B: -5hp / +3 ca" },
            { id: "wyvern_a", nome: "Wyvern (Tipo A)", base: "wyvern", hp: 15, caVal: 12, visaoVal: 20, dif: "A para B: -2hp / +2 ca" },
            { id: "wyvern_b", nome: "Wyvern (Tipo B)", base: "wyvern", hp: 13, caVal: 14, visaoVal: 20, dif: "A para B: -2hp / +2 ca" },
            { id: "ant_a", nome: "Ant (Tipo A)", base: "ant", hp: 22, caVal: 6, visaoVal: 6, dif: "A para B: -1hp / 2d6 visão" },
            { id: "ant_b", nome: "Ant (Tipo B)", base: "ant", hp: 21, caVal: 6, visaoVal: "2d6", dif: "A para B: -1hp / 2d6 visão" },
            { id: "armored_a", nome: "Armored (Tipo A)", base: "armored", hp: 40, caVal: 10, visaoVal: 20, dif: "n tem B" },
            { id: "fungal_a", nome: "Fungal (Tipo A)", base: "fungal", hp: 30, caVal: 6, visaoVal: 10, dif: "A para B: +2hp / 3d10 visão" },
            { id: "fungal_b", nome: "Fungal (Tipo B)", base: "fungal", hp: 32, caVal: 6, visaoVal: "3d10", dif: "A para B: +2hp / 3d10 visão" },
            { id: "wolf_a", nome: "Wolf (Tipo A)", base: "wolf", hp: 25, caVal: 6, visaoVal: 6, dif: "n tem B" },
            { id: "mole_a", nome: "Mole (Tipo A)", base: "mole", hp: 22, caVal: 12, visaoVal: 20, dif: "n tem B" },
            { id: "plant_a", nome: "Plant (Tipo A)", base: "plant", hp: 15, caVal: 10, visaoVal: 10, dif: "n tem B" },
            { id: "paraves_a", nome: "Paraves (Tipo A)", base: "paraves", hp: 18, caVal: 12, visaoVal: 12, dif: "n tem B" },
            { id: "caudata_a", nome: "Caudata (Tipo A)", base: "caudata", hp: 40, caVal: 10, visaoVal: 6, dif: "A para B: -3hp / +5 ca" },
            { id: "caudata_b", nome: "Caudata (Tipo B)", base: "caudata", hp: 37, caVal: 15, visaoVal: 6, dif: "A para B: -3hp / +5 ca" }
        ];

        function montarPagina() {
            let seletorGlobal = document.getElementById('seletor-global');
            let container = document.getElementById('painel-monstros');
            let optionsHtml = `
                <option value="">-- Selecione na lista --</option>
                <option value="criar_ficha" style="color: #ff5252; font-weight: bold;">+ Criar Nova Ficha (Estilo Ordem)</option>
            `;
            let cardsHtml = document.getElementById('card-criar_ficha').outerHTML;

            monstrosLista.forEach(m => {
                optionsHtml += `<option value="${m.id}">${m.nome}</option>`;
                cardsHtml += criarCardHtml(m);
            });

            seletorGlobal.innerHTML = optionsHtml;
            container.innerHTML = cardsHtml;
            
            inicializarPericias();
            atualizarDerivados();
        }

        function carregarFoto(event) {
            let arquivo = event.target.files[0];
            if (arquivo) {
                let leitor = new FileReader();
                leitor.onload = function(e) {
                    let img = document.getElementById('avatar-preview');
                    let txt = document.getElementById('avatar-text');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    txt.style.display = 'none';
                }
                leitor.readAsDataURL(arquivo);
            }
        }

        function inicializarPericias() {
            let grid = document.getElementById('skills-container');
            let html = "";
            listaNomesPericias.forEach(nome => {
                html += `
                    <div class="skill-item" data-skill="${nome}">
                        <span>${nome}</span>
                        <div class="skill-controls">
                            <input type="number" class="skill-input" value="0" min="0" max="15" onchange="verificarPericias()">
                            <button type="button" class="roll-btn" title="Rolar Perícia" onclick="rolarPericia(this, '${nome}')">🎲</button>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function criarCardHtml(m) {
            return `
                <div class="monster-card card-${m.base}" id="card-${m.id}" style="display:none;">
                    <h2>${m.nome}</h2>
                    <select class="card-select" id="var-${m.id}" onchange="atualizarCard('${m.id}')">
                        <option value="yoju">Yoju (Pequeno)</option>
                        <option value="honju">Honju (Grande)</option>
                    </select>
                    <div class="stats">
                        <div class="stat-box">HP: <span id="hp-${m.id}">--</span></div>
                        <div class="stat-box">CA: <span id="ca-${m.id}">--</span></div>
                    </div>
                    <p><strong>Ataque:</strong> <span id="info-ataque-${m.id}">1d20 + 3</span></p>
                    <p><strong>Visão:</strong> <span id="info-visao-${m.id}">--</span></p>
                    <p style="font-size:0.75rem; color:#888;">${m.dif}</p>
                    
                    <button class="action-btn" onclick="rolar('${m.id}', 'ataque')">Rolar Ataque</button>
                    <div id="res-${m.id}-ataque" class="result"></div>
                    
                    <button class="action-btn" onclick="rolar('${m.id}', 'dano')">Rolar Dano</button>
                    <div id="res-${m.id}-dano" class="result"></div>

                    <button class="action-btn" onclick="rolar('${m.id}', 'visao')">Rolar Percepção/Visão</button>
                    <div id="res-${m.id}-visao" class="result"></div>
                </div>
            `;
        }

        function mostrarSelecao() {
            let escolhido = document.getElementById('seletor-global').value;
            let elements = document.querySelectorAll('.monster-card, .custom-sheet');
            elements.forEach(el => el.style.display = 'none');

            if (escolhido) {
                let alvo = document.getElementById(`card-${escolhido}`);
                if (alvo) {
                    alvo.style.display = 'block';
                    if (escolhido !== 'criar_ficha') {
                        atualizarCard(escolhido);
                    }
                }
            }
        }

        function verificarAtributos() {
            let inputs = document.querySelectorAll('.attr-input');
            let soma = 0;
            inputs.forEach(inp => soma += parseInt(inp.value) || 0);

            let restantes = 10 - soma;
            document.getElementById('atrib-restantes').innerText = restantes;

            if (restantes < 0) {
                alert("Você passou do limite de 10 pontos nos atributos!");
                event.target.value = parseInt(event.target.value) + restantes;
                verificarAtributos();
                return;
            }
            atualizarDerivados();
        }

        function rolarAtributo(nomeAtributo, idInput) {
            let qtdDados = parseInt(document.getElementById(idInput).value) || 0;
            let displayRes = document.getElementById('res-pericia-global');

            if (qtdDados <= 0) {
                displayRes.innerText = `${nomeAtributo}: 0 dados para rolar (Atributo 0)`;
                return;
            }

            let resultados = [];
            for (let i = 0; i < qtdDados; i++) {
                resultados.push(Math.floor(Math.random() * 20) + 1);
            }

            let maiorResultado = Math.max(...resultados);
            displayRes.innerText = `${nomeAtributo}: Maior ${maiorResultado} (${qtdDados}d20: [${resultados.join(', ')}])`;
        }

        function atualizarDerivados() {
            let agi = parseInt(document.getElementById('attr-agi').value) || 0;
            let forca = parseInt(document.getElementById('attr-for').value) || 0;
            let int = parseInt(document.getElementById('attr-int').value) || 0;
            let pre = parseInt(document.getElementById('attr-pre').value) || 0;
            let vig = parseInt(document.getElementById('attr-vig').value) || 0;
            let classe = document.getElementById('sheet-classe').value;

            let basePv = 12, incPv = 3;
            let baseSan = 12, incSan = 3;
            let basePe = 2, incPe = 2;

            if (classe === 'combatente') {
                basePv = 20; incPv = 4;
                baseSan = 12; incSan = 3;
                basePe = 2; incPe = 2;
            } else if (classe === 'especialista') {
                basePv = 16; incPv = 3;
                baseSan = 16; incSan = 4;
                basePe = 3; incPe = 3;
            } else if (classe === 'ocultista') {
                basePv = 12; incPv = 2;
                baseSan = 20; incSan = 5;
                basePe = 4; incPe = 4;
            }

            let pvTotal = basePv + (vig * incPv);
            let sanTotal = baseSan + (pre * incSan);
            let peTotal = basePe + (pre * incPe);
            let defesaTotal = 10 + agi;
            let esquivaTotal = 10 + agi;

            document.getElementById('calc-pv').innerText = pvTotal;
            document.getElementById('calc-san').innerText = sanTotal;
            document.getElementById('calc-pe').innerText = peTotal;
            document.getElementById('calc-def').innerText = defesaTotal;
            document.getElementById('calc-esq').innerText = esquivaTotal;

            atualizarInventario(forca);
        }

        function atualizarInventario(forca) {
            let totalSlots = 5 + (forca * 3);
            document.getElementById('inv-capacidade').innerText = totalSlots;

            let box = document.getElementById('inventory-slots-box');
            let htmlAtual = "";

            for (let i = 1; i <= totalSlots; i++) {
                htmlAtual += `
                    <div class="inventory-slot">
                        <input type="text" placeholder="Item ${i}..." />
                        <input type="number" placeholder="Peso" min="0" max="5" />
                    </div>
                `;
            }
            box.innerHTML = htmlAtual;
        }

        function verificarPericias() {
            let inputs = document.querySelectorAll('.skill-input');
            let soma = 0;
            inputs.forEach(inp => soma += parseInt(inp.value) || 0);

            let restantes = 20 - soma;
            document.getElementById('pericia-restantes').innerText = restantes;

            if (restantes < 0) {
                alert("Você passou do limite de 20 pontos nas perícias!");
                event.target.value = parseInt(event.target.value) + restantes;
                verificarPericias();
                return;
            }

            ordenarPericias();
        }

        function ordenarPericias() {
            let grid = document.getElementById('skills-container');
            let itens = Array.from(grid.querySelectorAll('.skill-item'));

            itens.sort((a, b) => {
                let valorA = parseInt(a.querySelector('.skill-input').value) || 0;
                let valorB = parseInt(b.querySelector('.skill-input').value) || 0;

                if (valorA !== valorB) {
                    return valorB - valorA;
                }
                let nomeA = a.getAttribute('data-skill');
                let nomeB = b.getAttribute('data-skill');
                return nomeA.localeCompare(nomeB);
            });

            itens.forEach(item => grid.appendChild(item));
        }

        function rolarPericia(botaoElemento, nomePericia) {
            let skillItem = botaoElemento.closest('.skill-item');
            let inputTreino = skillItem.querySelector('.skill-input');
            let pontosTreino = parseInt(inputTreino.value) || 0;

            let d20 = Math.floor(Math.random() * 20) + 1;
            let total = d20 + pontosTreino;

            let displayRes = document.getElementById('res-pericia-global');
            displayRes.innerText = `${nomePericia}: Total ${total} (1d20: ${d20} + ${pontosTreino} treino)`;
        }

        function obterStats(chave) {
            let m = monstrosLista.find(item => item.id === chave);
            let elementoVar = document.getElementById('var-' + chave);
            let variante = elementoVar ? elementoVar.value : 'yoju';

            let hp = m.hp;
            let ca = m.caVal;
            let visaoFaces = m.visaoVal;

            let descVisaoStr = typeof visaoFaces === 'number' ? `1d${visaoFaces}` : visaoFaces;

            if (variante === 'honju') {
                hp = Math.floor(hp * 1.8);
                ca += 2;
            }

            return {
                hp: hp,
                ca: ca,
                visaoFacesRaw: visaoFaces,
                tipoVisaoDesc: descVisaoStr
            };
        }

        function atualizarCard(chave) {
            let s = obterStats(chave);
            document.getElementById('hp-' + chave).innerText = s.hp;
            document.getElementById('ca-' + chave).innerText = s.ca;
            document.getElementById('info-visao-' + chave).innerText = s.tipoVisaoDesc;
        }

        function rolar(chave, tipoAcao) {
            let s = obterStats(chave);

            if (tipoAcao === 'ataque') {
                let dado = Math.floor(Math.random() * 20) + 1;
                let total = dado + 4;
                document.getElementById(`res-${chave}-ataque`).innerText = `Total: ${total} (1d20: ${dado} + 4)`;
            } else if (tipoAcao === 'dano') {
                let dado = Math.floor(Math.random() * 6) + 1;
                let total = dado + 2;
                document.getElementById(`res-${chave}-dano`).innerText = `Total: ${total} de dano (1d6: ${dado} + 2)`;
            } else if (tipoAcao === 'visao') {
                let resultadoVisao = 0;
                let descRolagem = "";
                
                if (typeof s.visaoFacesRaw === 'number') {
                    let dado = Math.floor(Math.random() * s.visaoFacesRaw) + 1;
                    resultadoVisao = dado;
                    descRolagem = `1d${s.visaoFacesRaw}: ${dado}`;
                } else {
                    let partes = s.visaoFacesRaw.split('d');
                    let qtd = parseInt(partes[0]);
                    let faces = parseInt(partes[1]);
                    let soma = 0;
                    let lancamentos = [];
                    for(let i=0; i<qtd; i++) {
                        let d = Math.floor(Math.random() * faces) + 1;
                        soma += d;
                        lancamentos.push(d);
                    }
                    resultadoVisao = soma;
                    descRolagem = `${s.visaoFacesRaw}: [${lancamentos.join(', ')}]`;
                }

                document.getElementById(`res-${chave}-visao`).innerText = `Visão: ${resultadoVisao} (${descRolagem})`;
            }
        }

                function baixarFichaImagem() {
            let cardFicha = document.getElementById('card-criar_ficha');
            let botao = cardFicha.querySelector('.save-btn');
            let textareaDesc = document.getElementById('sheet-descricao');
            
            // Oculta o botão de salvar para não sair na imagem
            botao.style.display = 'none';

            // Salva os estilos originais para restaurar depois
            let alturaOriginal = cardFicha.style.height;
            let overflowOriginal = textareaDesc.style.overflow;
            let alturaTextareaOriginal = textareaDesc.style.height;

            // Expande o container e a caixa de texto para caber todo o conteúdo sem barras de rolagem
            cardFicha.style.height = 'auto';
            textareaDesc.style.height = textareaDesc.scrollHeight + 'px';
            textareaDesc.style.overflow = 'visible';

            html2canvas(cardFicha, { backgroundColor: '#1e1e1e', scale: 2 }).then(canvas => {
                let link = document.createElement('a');
                link.download = 'ficha-personagem.png';
                link.href = canvas.toDataURL('image/png');
                link.click();

                // Restaura os estilos originais da ficha
                botao.style.display = 'block';
                cardFicha.style.height = alturaOriginal;
                textareaDesc.style.height = alturaTextareaOriginal;
                textareaDesc.style.overflow = overflowOriginal;
            }).catch(err => {
                // Garante que a ficha volte ao normal mesmo se houver erro
                botao.style.display = 'block';
                cardFicha.style.height = alturaOriginal;
                textareaDesc.style.height = alturaTextareaOriginal;
                textareaDesc.style.overflow = overflowOriginal;
            });
        }


        window.onload = function() {
            montarPagina();
        };
    </script>
</body>
