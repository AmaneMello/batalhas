<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Monstros - RPG</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .monster-card {
            background-color: #1e1e1e;
            border: 2px solid #b71c1c;
            border-radius: 8px;
            width: 350px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 { color: #ff5252; margin-top: 0; border-bottom: 1px solid #b71c1c; padding-bottom: 8px; }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        .stat-box {
            background: #2c2c2c;
            padding: 8px;
            text-align: center;
            border-radius: 4px;
        }
        button {
            background-color: #b71c1c;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #d32f2f;
        }
        .result {
            margin-top: 8px;
            font-style: italic;
            color: #ff8a80;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="monster-card">
        <h2>Goblin Guerreiro</h2>
        <p><strong>ND:</strong> 1/4 | <strong>Tipo:</strong> Humanoide</p>
        
        <div class="stats">
            <div class="stat-box"><strong>HP:</strong> 15</div>
            <div class="stat-box"><strong>CA:</strong> 15</div>
        </div>

        <h3>Ações</h3>
        <p><strong>Cimitarra:</strong> Alcance 1,5m.</p>
        
        <button onclick="rolarAtaque()">Rolar Ataque (1d20 + 4)</button>
        <div id="resultado-ataque" class="result"></div>

        <button onclick="rolarDano()">Rolar Dano (1d6 + 2)</button>
        <div id="resultado-dano" class="result"></div>
    </div>

    <script>
        function rolarAtaque() {
            // Sorteia um número de 1 a 20 e soma 4
            let dado = Math.floor(Math.random() * 20) + 1;
            let total = dado + 4;
            document.getElementById('resultado-ataque').innerText = `Resultado: ${total} (Dado: ${dado} + 4)`;
        }

        function rolarDano() {
            // Sorteia um número de 1 a 6 e soma 2
            let dado = Math.floor(Math.random() * 6) + 1;
            let total = dado + 2;
            document.getElementById('resultado-dano').innerText = `Resultado: ${total} de dano (Dado: ${dado} + 2)`;
        }
    </script>

</body>
</html>
