<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Monstros - RPG</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #ff5252;
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #b71c1c;
            padding-bottom: 10px;
            width: 100%;
            max-width: 800px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 900px;
        }
        .monster-card {
            background-color: #1e1e1e;
            border: 2px solid #b71c1c;
            border-radius: 8px;
            width: 350px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        /* Estilo personalizado para diferenciar a segunda ficha (Orc) */
        .monster-card.orc {
            border-color: #2e7d32;
        }
        .monster-card.orc h2 {
            color: #66bb6a;
            border-bottom-color: #2e7d32;
        }
        .monster-card.orc button {
            background-color: #2e7d32;
        }
        .monster-card.orc button:hover {
            background-color: #388e3c;
        }
        .monster-card.orc .result {
            color: #a5d6a7;
        }

        h2 { 
            color: #ff5252; 
            margin-top: 0; 
            border-bottom: 1px solid #b71c1c; 
            padding-bottom: 8px; 
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        .stat-box {
            background: #2c2c2c;
            padding: 8px;
            text-align: center;
            border-radius: 4px;
        }
        button {
            background-color: #b71c1c;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
            width: 100%;
            font-weight: bold;
        }
        button:hover { 
            background-color: #d32f2f; 
        }
        .result {
            margin-top: 8px;
            margin-bottom: 15px;
            font-style: italic;
            color: #ff8a80;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Batalha de Monstros</h1>

    <div class="container">
        <!-- Ficha 1: Goblin -->
        <div class="monster-card">
            <h2>Goblin Guerreiro</h2>
            <p><strong>Tipo:</strong> Humanoide | <strong>ND:</strong> 1/4</p>
            
            <div class="stats">
                <div class="stat-box"><strong>HP:</strong> 15</div>
                <div class="stat-box"><strong>CA:</strong> 15</div>
            </div>

            <h3>Ações</h3>
            <p><strong>Cimitarra:</strong> +4 para acertar (1d6 + 2)</p>
            
            <button onclick="rolarDados('goblin', 20, 4, 'ataque')">Rolar Ataque (1d20 + 4)</button>
            <div id="resultado-goblin-ataque" class="result"></div>

            <button onclick="rolarDados('goblin', 6, 2, 'dano')">Rolar Dano (1d6 + 2)</button>
            <div id="resultado-goblin-dano" class="result"></div>
        </div>

        <!-- Ficha 2: Orc -->
        <div class="monster-card orc">
            <h2>Orc Brutamontes</h2>
            <p><strong>Tipo:</strong> Humanoide | <strong>ND:</strong> 1</p>
            
            <div class="stats">
                <div class="stat-box"><strong>HP:</strong> 30</div>
                <div class="stat-box"><strong>CA:</strong> 13</div>
            </div>

            <h3>Ações</h3>
            <p><strong>Machado Grande:</strong> +5 para acertar (1d12 + 3)</p>
            
            <button onclick="rolarDados('orc', 20, 5, 'ataque')">Rolar Ataque (1d20 + 5)</button>
            <div id="resultado-orc-ataque" class="result"></div>

            <button onclick="rolarDados('orc', 12, 3, 'dano')">Rolar Dano (1d12 + 3)</button>
            <div id="resultado-orc-dano" class="result"></div>
        </div>
    </div>

    <script>
        // Função inteligente única que serve para qualquer monstro e qualquer dado!
        function rolarDados(monstro, facesDado, modificador, tipo) {
            let dado = Math.floor(Math.random() * facesDado) + 1;
            let total = dado + modificador;
            
            let elementoId = `resultado-${monstro}-${tipo}`;
            let texto = tipo === 'ataque' 
                ? `Resultado: ${total} (Dado: ${dado} + ${modificador})`
                : `Resultado: ${total} de dano (Dado: 1d${facesDado} + ${modificador})`;

            document.getElementById(elementoId).innerText = texto;
        }
    </script>

</body>
</html>
